<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="/2-Form/form.css">
</head>
<body>
	<main>
		<header>
			<h1 class="header-h1">Регистрация</h1>
		</header> 
		<section class="header-section">
			<span class="header-span">Уже есть аккаунт?</span>
			<a href="/#">Войти</a>
		</section>
		<div>
			<p>Моя компания</p>
		</div>
		<section class="reg-form">
			<form action="/">
					<div class="form-box">
									<div class="inputs-name">
											<input class="reg-dialog-input"   placeholder="Имя" name="firstName" type="text">
											<input class="reg-dialog-input"  name="lastName" placeholder="Фамилия" type="text">
									</div>
									<div class="input-email-box" >
											<input class="reg-dialog-input input-email" placeholder="email" name="email" type="email">
									</div>
									<button class="form-btn">
											<span style="color: #ffffff;">Зарегистрироваться</span>
											<img style="width: 22px; height: 22px;" src="/2-Form/images/Arrow 1.png"></img>
									</button>
					</div>
					<div class="checkbox-box">
						<input id="checkbox" type="checkbox" name="read" value="readed">
							<label for="checkbox">Я прочитал и принимаю 
							</label>
							<a href="/#">Условия использования</a>
					</div>
			</form>
		</section>
	</main>
</body>
</html>
